name: goreleaser

on:
  push:
    tags:
      - 'v[0-9]*'
  pull_request:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test release tag validation
        run: bash .github/scripts/test_validate_release_tag.sh
      - name: Validate tag before GoReleaser
        if: github.ref_type == 'tag'
        run: bash .github/scripts/validate-release-tag.sh "$GITHUB_REF_NAME"
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ github.event_name == 'pull_request' && 'release --snapshot --clean' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
