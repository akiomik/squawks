name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: .go-version

    - name: Build
      run: make build

    - name: Test
      run: make test

    - name: Run staticcheck
      run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./... # Staticcheck 2026.2.2
